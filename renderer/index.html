<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工资小组件</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card" id="card" data-status="working">
    <div class="glow" aria-hidden="true"></div>

    <header class="top">
      <div class="status" id="statusPill">
        <span class="dot"></span>
        <span id="statusText">工作中</span>
      </div>
      <div class="top-right">
        <span class="date" id="dateText">--月--日</span>
        <div class="actions">
          <button class="icon-btn" id="menuBtn" title="更多">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
              <circle cx="5" cy="12" r="1.7" />
              <circle cx="12" cy="12" r="1.7" />
              <circle cx="19" cy="12" r="1.7" />
            </svg>
          </button>
          <button class="icon-btn" id="pinBtn" title="切换窗口置顶">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 17v5" />
              <path d="M9 3h6l-1.5 7L17 12v2H7v-2l3.5-2L9 3z" />
            </svg>
          </button>
          <button class="icon-btn" id="settingsBtn" title="设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </button>
          <button class="icon-btn close" id="closeBtn" title="关闭">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="content-scale" id="contentScale">
      <section class="money">
        <div class="label">今日已赚</div>
        <div class="amount">
          <span class="cur">¥</span><span id="amount">0.00</span>
        </div>
        <div class="progress"><div class="bar" id="bar"></div></div>
        <div class="sub">
          <span id="pct">0%</span>
          <span id="target">今日满勤 ¥0.00</span>
        </div>
      </section>

      <div class="finish-toast" id="finishToast" hidden>今天的你也很棒，辛苦了！快去休息吧！</div>
      <div class="makeup-notice" id="makeupNotice" hidden>明天需要补班哦~别忘记了!</div>

      <footer class="bottom">
        <div class="countdown-block">
          <div class="label" id="cdLabel">距下班</div>
          <div class="countdown" id="countdown">00:00:00</div>
        </div>
        <div class="rates" id="rates">
          <div><span>时薪</span><b id="hourly">¥0.00</b></div>
          <div><span id="otRateLabel">加班</span><b id="otRate">¥0.00/时</b></div>
        </div>
        <div class="action-buttons" id="actionButtons">
          <button class="off-btn" id="offBtn" type="button" hidden>我下班啦！</button>
          <button class="now-btn" id="nowStartBtn" type="button" hidden>现在开始加班</button>
          <button class="backfill-btn" id="backfillBtn" type="button" hidden>补录开始时间</button>
          <button class="ot-btn" id="otBtn" type="button" hidden>我要加班</button>
        </div>
        <div class="backfill-panel" id="backfillPanel" hidden>
          <span>开始时间</span>
          <input id="backfillTime" type="time" step="60">
          <button class="backfill-confirm" id="backfillConfirm" type="button">确认</button>
          <button class="backfill-cancel" id="backfillCancel" type="button">取消</button>
        </div>
      </footer>
    </div>

    <div class="weekend-prompt" id="weekendPrompt" hidden>
      <span class="weekend-prompt-text">明天周末要加班吗？</span>
      <span class="weekend-prompt-actions">
        <button class="weekend-btn yes" id="weekendYes" type="button">要加班</button>
        <button class="weekend-btn no" id="weekendNo" type="button">不加班</button>
      </span>
    </div>

    <div class="resize-grip" id="resizeGrip" title="拖动调整窗口大小" aria-label="拖动调整窗口大小"></div>
  </main>

  <div class="edge-bar" id="edgeBar"><i id="edgeBarFill"></i><canvas class="edge-ticks" id="edgeTicks" aria-hidden="true"></canvas></div>

  <script src="renderer.js"></script>
</body>
</html>
